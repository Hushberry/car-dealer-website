<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password — Vincent's Auto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-wrap {
            max-width: 380px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .auth-wrap h1 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-wrap .sub {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="auth-wrap">
        <h1>Reset Password</h1>
        <p class="sub">Enter your username, the recovery key, and a new password.</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p class="flash-error">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="form-block" style="max-width:none;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Recovery Key</label>
            <input type="password" name="recovery_key" required>
            <label>New Password</label>
            <input type="password" name="new_password" required>
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>
            <button type="submit" class="btn-gold" style="width:100%; margin-top:24px;">Reset Password</button>
        </form>

        <a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to Dashboard</a>
    </div>
</body>

</html>
