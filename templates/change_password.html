<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password — PrimeDrive Motors</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>.auth-wrap { max-width: 380px; margin: 80px auto; padding: 0 20px; }</style>
</head>
<body>
    <div class="auth-wrap">
        <h1 style="font-size:24px; font-weight:400;">Change Password</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="flash-error">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="form-block" style="max-width:none;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Current Password</label>
            <input type="password" name="current_password" required>
            <label>New Password</label>
            <input type="password" name="new_password" required>
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>
            <button type="submit" class="btn-gold" style="width:100%; margin-top:24px;">Change Password</button>
        </form>
        <a href="{{ url_for('admin_dashboard') }}" style="display:block; text-align:center; margin-top:20px; color:var(--muted); font-size:13px; text-decoration:none;">← Back to Dashboard</a>
    </div>
</body>
</html>
