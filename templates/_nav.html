<script id="theme-js">
(function () {
  var b = document.querySelector('.theme-toggle');
  if (!b) return;
  b.addEventListener('click', function () {
    var root = document.documentElement;
    var light = root.getAttribute('data-theme') === 'light';
    if (light) { root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme', 'light'); }
    try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch (e) {}
  });
})();
</script>
<script id="theme-fix-js">
(function () {
  var root = document.documentElement;
  var SKIP = '.hero-banner,[class*="hero"]:not(.cars-hero),.lux-stage,.card-photo,[class*="gallery"],.lightbox,[class*="photo-"],.theme-toggle,script,style,svg,img,input,textarea,select,option';
  function chan(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function rl(r, g, b) { return 0.2126 * chan(r) + 0.7152 * chan(g) + 0.0722 * chan(b); }
  function rgba(s) {
    var m = (s || '').match(/[\d.]+/g);
    if (!m || m.length < 3) return null;
    return { r: +m[0], g: +m[1], b: +m[2], a: m.length > 3 ? +m[3] : 1 };
  }
  function bgOf(el) {
    var a = el;
    while (a && a !== document.documentElement) {
      var cs = getComputedStyle(a);
      if (cs.backgroundImage && cs.backgroundImage !== 'none') return null;
      var c = rgba(cs.backgroundColor);
      if (c && c.a > 0.5) return rl(c.r, c.g, c.b);
      a = a.parentElement;
    }
    var b = rgba(getComputedStyle(document.body).backgroundColor);
    return b && b.a > 0.5 ? rl(b.r, b.g, b.b) : 0.9;
  }
  function ownText(el) {
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3 && n.nodeValue.trim()) return true;
    }
    return false;
  }
  function ratioOf(t, b) { return (Math.max(t, b) + 0.05) / (Math.min(t, b) + 0.05); }
  function clear() {
    [].forEach.call(document.querySelectorAll('[data-lt]'), function (el) {
      var o = el.getAttribute('data-lt');
      if (o) el.style.setProperty('color', o); else el.style.removeProperty('color');
      el.removeAttribute('data-lt');
    });
  }
  var busy = false;
  function fix() {
    if (busy) return;
    busy = true;
    if (root.getAttribute('data-theme') !== 'light') { clear(); busy = false; return; }
    var els = document.body.querySelectorAll('*');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute('data-lt') || !ownText(el)) continue;
      if (el.closest(SKIP)) continue;
      var cs = getComputedStyle(el), c = rgba(cs.color);
      if (!c || c.a < 0.5) continue;
      var bl = bgOf(el);
      if (bl === null || bl < 0.5) continue;
      var tl = rl(c.r, c.g, c.b), ratio = ratioOf(tl, bl);
      var colorful = (Math.max(c.r, c.g, c.b) - Math.min(c.r, c.g, c.b)) > 45;
      var to = null;
      if (colorful) {
        if (ratio < 3) {
          var r = c.r, g = c.g, b = c.b, k = 0;
          while (ratioOf(rl(r, g, b), bl) < 3.4 && k < 4) { r *= 0.72; g *= 0.72; b *= 0.72; k++; }
          to = 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
        }
      } else if (ratio < 4.2) {
        to = '#17171b';
      }
      if (to) {
        el.setAttribute('data-lt', el.style.getPropertyValue('color') || '');
        el.style.setProperty('color', to, 'important');
      }
    }
    busy = false;
  }
  var timer = null;
  function later(ms) { clearTimeout(timer); timer = setTimeout(fix, ms); }
  document.addEventListener('DOMContentLoaded', function () { fix(); later(1200); });
  window.addEventListener('load', function () { fix(); later(1500); later(3500); });
  var tg = document.querySelector('.theme-toggle');
  if (tg) tg.addEventListener('click', function () { setTimeout(fix, 30); });
  try {
    new MutationObserver(function () { later(400); }).observe(document.body || document.documentElement, { childList: true, subtree: true });
  } catch (e) {}
})();
</script>
