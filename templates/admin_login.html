<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login — Vincent's Auto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-wrap { max-width: 380px; margin: 100px auto; padding: 0 20px; }
        .auth-wrap h1 { font-size: 24px; font-weight: 400; margin-bottom: 24px; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <h1>VINCENT'S <em style="color:var(--champagne); font-style:normal;">AUTO</em></h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="flash-error">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="form-block" style="max-width:none;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit" class="btn-gold" style="width:100%; margin-top:24px;">Login</button>
        </form>
        <a href="{{ url_for('forgot_password') }}" style="display:block; text-align:center; margin-top:16px; color:var(--muted); font-size:13px; text-decoration:none;">Forgot Password?</a>
    </div>
</body>
</html>
